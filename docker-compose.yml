version: '3.9'

services:
  ablesci-sign:
    build: .
    image: ablesci-sign:latest
    container_name: ablesci-sign
    restart: unless-stopped
    environment:
      - ABLESCI_EMAIL=your@example.com
      - ABLESCI_PASSWORD=secret
      - CHECK_INTERVAL=30m
      - DYNAMIC_WINDOW_START=08:00
      - DYNAMIC_WINDOW_END=18:00
      - DYNAMIC_WINDOW_SPAN=45m
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
    healthcheck:
      test: ["CMD-SHELL", "pgrep signbot || exit 1"]
      interval: 10m
      timeout: 5s
      retries: 3