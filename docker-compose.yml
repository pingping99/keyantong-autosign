services:
  keyantong-autosign:
    build: .
    image: keyantong-autosign:latest
    container_name: keyantong-autosign
    restart: unless-stopped
    environment:
      ABLESCI_EMAIL: ${ABLESCI_EMAIL}
      ABLESCI_PASSWORD: ${ABLESCI_PASSWORD}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-30m}
      RETRY_INTERVAL: ${RETRY_INTERVAL:-10m}
      SIGN_JITTER_MAX: ${SIGN_JITTER_MAX:-5m}
      FORCE_SIGN_ON_START: ${FORCE_SIGN_ON_START:-false}
      EARLY_HOUR_THRESHOLD: ${EARLY_HOUR_THRESHOLD:-8}
      LATE_HOUR_THRESHOLD: ${LATE_HOUR_THRESHOLD:-22}
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /app/data
      HEALTH_CHECK_PORT: 8080
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
