version: '3.9'

services:
  ablesci-sign:
    build: .
    image: ablesci-sign:latest
    container_name: ablesci-sign
    restart: unless-stopped
    environment:
      # Required: Account credentials (set in .env file or override here)
      - ABLESCI_EMAIL=${ABLESCI_EMAIL}
      - ABLESCI_PASSWORD=${ABLESCI_PASSWORD}

      # Optional: Smart sign-in configuration
      - CHECK_INTERVAL=30m              # Check interval (default: 30m)
      - RETRY_INTERVAL=10m              # Retry interval on failure (default: 10m)
      - FORCE_SIGN_ON_START=true        # Force sign on startup (default: true)

      # Optional: System configuration
      - TZ=Asia/Shanghai                # Timezone (default: Asia/Shanghai)
      - DATA_DIR=/app/data              # Data directory for logs and state
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pgrep signbot || exit 1"]
      interval: 10m
      timeout: 5s
      retries: 3